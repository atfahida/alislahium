<!DOCTYPE html>
<html>
<head>

    <title>Add Student</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>

<body>

<div class="container mt-5">

    <div class="d-flex justify-content-between align-items-center mb-4">

    <h2 class="mb-0">Add Student</h2>

    <a
        href="{% url 'dashboard' %}"
        class="btn btn-primary"
    >
        Dashboard
    </a>

</div>

    <form method="POST">

        {% csrf_token %}

        <div class="mb-3">
            <label>Student ID</label>
            <input
                type="text"
                name="student_id"
                class="form-control"
                required
            >
        </div>

        <div class="mb-3">
            <label>Name</label>
            <input
                type="text"
                name="name"
                class="form-control"
                required
            >
        </div>

        <div class="mb-3">
            <label>Class</label>
            <input
                type="text"
                name="class_name"
                class="form-control"
                required
            >
        </div>

        <div class="mb-3">
            <label>Division</label>
            <input
                type="text"
                name="division"
                class="form-control"
            >
        </div>

        <div class="mb-3">
            <label>House</label>
            <input
                type="text"
                name="house"
                class="form-control"
                required
            >
        </div>

        <div class="mb-3">
            <label>Phone</label>
            <input
                type="text"
                name="phone"
                class="form-control"
            >
        </div>

        <button
            type="submit"
            class="btn btn-primary"
        >
            Save Student
        </button>
        

    </form>

</div>

</body>
</html>
