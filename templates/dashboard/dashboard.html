<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Dashboard - Al Islahium '26</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body>

<nav class="navbar navbar-dark bg-dark">
    <div class="container">

        <a class="navbar-brand" href="/">
            AL ISLAHIUM '26
        </a>

      <form method="post"
      action="{% url 'logout' %}"
      class="d-inline">

    {% csrf_token %}

    <button type="submit"
            class="btn btn-outline-light">
        Logout
    </button>

</form>

    </div>
</nav>


<div class="container mt-5">

    <h1 class="mb-2">
        Arts Fest Dashboard
    </h1>

    <p class="text-muted">
        Al Islahium '26 Management System
    </p>


    <div class="row g-4 mt-3">

        <div class="col-md-3">

            <div class="card shadow-sm">
                <div class="card-body">

                    <h5>Students</h5>

                    <a href="/students/"
                       class="btn btn-primary">
                        Manage Students
                    </a>

                </div>
            </div>

        </div>


        <div class="col-md-3">

            <div class="card shadow-sm">
                <div class="card-body">

                    <h5>Events</h5>

                    <a href="/events/"
                       class="btn btn-success">
                        Manage Events
                    </a>

                </div>
            </div>

        </div>


        <div class="col-md-3">

            <div class="card shadow-sm">
                <div class="card-body">

                    <h5>Participants</h5>

                    <a href="/participants/"
                       class="btn btn-warning">
                        View Participants
                    </a>

                </div>
            </div>

        </div>


        <div class="col-md-3">

            <div class="card shadow-sm">
                <div class="card-body">

                    <h5>Results</h5>

                    <a href="/results/"
                       class="btn btn-danger">
                        View Results
                    </a>

                </div>
            </div>

        </div>

    </div>

</div>

</body>
</html>
