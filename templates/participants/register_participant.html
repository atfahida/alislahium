<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Register Participant - Al Islahium '26</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body>

<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <a class="navbar-brand" href="{% url 'dashboard' %}">
            AL ISLAHIUM '26
        </a>

        <a
            href="{% url 'participant_list' %}"
            class="btn btn-outline-light"
        >
            ← Back to Participants
        </a>

    </div>

</nav>


<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-7">

            <div class="card shadow">

                <div class="card-header bg-primary text-white">

                    <h4 class="mb-0">
                        Register Participant
                    </h4>

                </div>


                <div class="card-body">

                    <form method="POST">

                        {% csrf_token %}


                        <!-- Student -->

                        <div class="mb-3">

                            <label class="form-label">
                                Student
                            </label>

                            <select
                                name="student"
                                class="form-select"
                                required
                            >

                                <option value="">
                                    Select Student
                                </option>

                                {% for student in students %}

                                <option value="{{ student.id }}">

                                    {{ student.student_id }}
                                    - 
                                    {{ student.name }}
                                    -
                                    Class {{ student.class_name }}

                                </option>

                                {% endfor %}

                            </select>

                        </div>


                        <!-- Event -->

                        <div class="mb-3">

                            <label class="form-label">
                                Event
                            </label>

                            <select
                                name="event"
                                class="form-select"
                                required
                            >

                                <option value="">
                                    Select Event
                                </option>

                                {% for event in events %}

                                <option value="{{ event.id }}">

                                    {{ event.event_name }}
                                    -
                                    {{ event.category.name }}

                                </option>

                                {% endfor %}

                            </select>

                        </div>


                        <!-- Bib Number -->

                        <div class="mb-3">

                            <label class="form-label">
                                Bib Number
                            </label>

                            <input
                                type="text"
                                name="bib_number"
                                class="form-control"
                                placeholder="Example: B001"
                                required
                            >

                        </div>


                        <div class="mt-4">

                            <button
                                type="submit"
                                class="btn btn-success"
                            >
                                Register Participant
                            </button>


                            <a
                                href="{% url 'participant_list' %}"
                                class="btn btn-secondary"
                            >
                                Cancel
                            </a>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

</body>

</html>
