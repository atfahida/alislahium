<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Add Result - Al Islahium '26</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body>

<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <a class="navbar-brand" href="/">
            AL ISLAHIUM '26
        </a>

        <a
            href="{% url 'result_list' %}"
            class="btn btn-outline-light"
        >
            View Results
        </a>

    </div>

</nav>


<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-7">

            <div class="card shadow">

                <div class="card-header bg-primary text-white">

                    <h4 class="mb-0">
                        Add Result
                    </h4>

                </div>


                <div class="card-body">

                    <form method="POST">

                        {% csrf_token %}


                        <!-- Participant -->

                        <div class="mb-3">

                            <label class="form-label">
                                Participant
                            </label>

                            <select
                                name="participant"
                                class="form-select"
                                required
                            >

                                <option value="">
                                    Select Participant
                                </option>

                                {% for participant in participants %}

                                <option value="{{ participant.id }}">

                                    {{ participant.student.name }}
                                    -
                                    {{ participant.event.event_name }}

                                </option>

                                {% endfor %}

                            </select>

                        </div>


                        <!-- Place -->

                        <div class="mb-3">

                            <label class="form-label">
                                Place
                            </label>

                            <select
                                name="place"
                                class="form-select"
                                required
                            >

                                <option value="">
                                    Select Place
                                </option>

                                <option value="1">
                                    First
                                </option>

                                <option value="2">
                                    Second
                                </option>

                                <option value="3">
                                    Third
                                </option>

                            </select>

                        </div>


                        <!-- Grade -->

                        <div class="mb-3">

                            <label class="form-label">
                                Grade
                            </label>

                            <select
                                name="grade"
                                class="form-select"
                                required
                            >

                                <option value="">
                                    Select Grade
                                </option>

                                <option value="A">
                                    A
                                </option>

                                <option value="B">
                                    B
                                </option>

                                <option value="C">
                                    C
                                </option>

                            </select>

                        </div>


                        <div class="alert alert-info">

                            <strong>Points System</strong>

                            <br>

                            First = 10 points

                            <br>

                            Second = 8 points

                            <br>

                            Third = 5 points

                            <br><br>

                            Grade A = 10 points

                            <br>

                            Grade B = 5 points

                            <br>

                            Grade C = 3 points

                        </div>


                        <button
                            type="submit"
                            class="btn btn-success"
                        >
                            Save Result
                        </button>


                        <a
                            href="{% url 'result_list' %}"
                            class="btn btn-secondary"
                        >
                            Cancel
                        </a>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
