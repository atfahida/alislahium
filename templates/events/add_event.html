<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Add Event</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body>

<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <a class="navbar-brand" href="/">
            AL ISLAHIUM '26
        </a>

        <a
            href="{% url 'event_list' %}"
            class="btn btn-outline-light"
        >
            Back to Events
        </a>

    </div>

</nav>


<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-7">

            <div class="card shadow">

                <div class="card-header bg-primary text-white">

                    <h4 class="mb-0">
                        Add New Event
                    </h4>

                </div>


                <div class="card-body">

                    <form method="POST">

                        {% csrf_token %}


                        <div class="mb-3">

                            <label class="form-label">
                                Event Name
                            </label>

                            <input
                                type="text"
                                name="event_name"
                                class="form-control"
                                placeholder="Example: Recitation Malayalam"
                                required
                            >

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Category
                            </label>

                            <select
                                name="category"
                                class="form-select"
                                required
                            >

                                <option value="">
                                    Select Category
                                </option>

                                {% for category in categories %}

                                <option value="{{ category.id }}">

                                    {{ category.name }}
                                    -
                                    {{ category.classes }}

                                </option>

                                {% endfor %}

                            </select>

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Event Type
                            </label>

                            <select
                                name="event_type"
                                class="form-select"
                                required
                            >

                                <option value="">
                                    Select Type
                                </option>

                                <option value="Individual">
                                    Individual
                                </option>

                                <option value="Group">
                                    Group
                                </option>

                            </select>

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Stage
                            </label>

                            <input
                                type="text"
                                name="stage"
                                class="form-control"
                                placeholder="Example: Stage 1"
                                required
                            >

                        </div>


                        <button
                            type="submit"
                            class="btn btn-success"
                        >
                            Save Event
                        </button>

                        <a
                            href="{% url 'event_list' %}"
                            class="btn btn-secondary"
                        >
                            Cancel
                        </a>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
